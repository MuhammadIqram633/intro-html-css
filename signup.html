<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Muhammad Iqram">
    <meta description="Signup page for the website">
    <title>Signup</title>
    <style>
        .singup {
            width: 300px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .email .password .confirm-password {
            margin-bottom: 5px;
            font-weight: bold;
            margin-top: 5px;
      
            
        }
       .emails {
            width: 270px;
            padding: 10px;
            margin-bottom: 1px;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-top: 5px;

            
        }
        button {
            width: 100px;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 0 auto;
            margin-top: 10px;
            display: flex;
            padding-left: 30px;
            text-align: center;
        }
        button:hover {
            background-color: #45a049;
        }
        button:focus {
            outline: none;
        }
        button:active {
            background-color: #3e8e41;
        }
      .sign {
            text-align: center;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
   <div class="singup">
    <h1 class="sign">Signup</h1>
    <p class="email">Email</p>
    <input class="emails" type="email" name="email" placeholder="Enter your email">
    <p class="password">Password</p>
    <input class="emails" type="password" name="password" placeholder="Enter your password">
    <p class="confirm-password">Confirm Password</p>
    <input class="emails" type="password" name="confirm-password" placeholder="Confirm your password">
    <button type="submit">Signup</button>
   </div>
</body>
</html>
